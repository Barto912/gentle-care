name: Auditoria de Documentacion y ADRs

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validar-markdown:
    name: Revisar formato de ADRs y Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v7

      - name: Revisar formato con markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/*.md'

  revisar-enlaces:
    name: Buscar enlaces rotos
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v7

      - name: Escanear enlaces con lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--no-progress --exclude-mail '**/*.md'"
          fail: false
