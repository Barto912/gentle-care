name: Gentle Care - RDD Continuous Integration on: push: branches: [ "main" ] pull\_request: branches: [ "main" ] jobs: build-and-test: runs-on: ubuntu-latest steps: - name: Checkout del código uses: actions/checkout@v4 - name: Configurar entorno de Go uses: actions/setup-go@v5 with: go-version: '1.22' - name: Verificar dependencias run: go mod tidy - name: Ejecutar Pruebas Unitarias (Strict TDD) run: go test -v -race ./... - name: Auditoría de Cobertura y Recibos run: go test -coverprofile=coverage.out ./...
